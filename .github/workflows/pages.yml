name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build documentation HTML
        run: python3 docs/build_docs.py

      - name: Prepare publish directory
        run: |
          rm -rf _site
          mkdir -p _site
          cp docs/.nojekyll _site/
          cp docs/index.html docs/status.html docs/404.html _site/
          cp -r docs/assets docs/learn docs/reference docs/spec _site/

      - name: Update repository About (description + homepage)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" \
            -d '{"description":"Low-level CForge language: dual compiler, epoll HTTP/TLS/SQLite server, full backend specification.","homepage":"https://sumesh-s-dev.github.io/cforge/"}'

      - name: Deploy gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: _site
          force_orphan: true

      - name: Enable GitHub Pages (branch gh-pages)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          body='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          code=$(curl -sS -o /tmp/cforge-pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -d "$body")
          if [ "$code" = "409" ]; then
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" -d "$body" || true
          elif [ "$code" != "201" ]; then
            echo "Pages API POST returned HTTP $code (manual enable may still be required):"
            cat /tmp/cforge-pages.json || true
          fi
