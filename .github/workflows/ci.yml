name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev libssl-dev libpq-dev openssl pkg-config
      - name: Server tests
        run: ./cforge test
      - name: Machine tests
        run: ./cforge machine-test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cforge
          POSTGRES_PASSWORD: cforge
          POSTGRES_DB: users
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cforge -d users"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev libssl-dev libpq-dev openssl pkg-config
      - name: Build
        run: ./cforge build
      - name: Smoke with Postgres
        env:
          PORT: "18082"
          TLS_PORT: "0"
          CFORGE_BIND: "127.0.0.1"
          CFORGE_PG_DSN: postgres://cforge:cforge@127.0.0.1:5432/users?sslmode=disable
        run: |
          ./build/cforge-users &
          pid=$!
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:18082/ready" && break; sleep 1; done
          curl -sf "http://127.0.0.1:18082/metrics" | grep db_backend | grep postgres
          kill $pid
          wait $pid || true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build docs site
        run: cd docs-site && npm ci && npm run build
