services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cforge
      POSTGRES_PASSWORD: cforge
      POSTGRES_DB: users
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cforge -d users"]
      interval: 2s
      timeout: 3s
      retries: 15

  cforge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      TLS_PORT: "8443"
      CFORGE_BIND: "0.0.0.0"
      CFORGE_PG_DSN: "postgres://cforge:cforge@db:5432/users?sslmode=disable"
      CFORGE_TLS_CERT: "/src/deploy/cert.pem"
      CFORGE_TLS_KEY: "/src/deploy/key.pem"
    ports:
      - "8080:8080"
      - "8443:8443"
    command: >
      sh -c 'test -f "$$CFORGE_TLS_CERT" || (mkdir -p deploy && openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1
      -keyout "$$CFORGE_TLS_KEY" -out "$$CFORGE_TLS_CERT" -days 365 -nodes -subj /CN=localhost);
      exec ./build/cforge-users'
